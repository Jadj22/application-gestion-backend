        required: true
      tags:
      - businesses
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/businesses/{business_id}/stock/movements/:
    post:
      operationId: businesses_stock_movements_create
      description: |-
        Crée un mouvement (US-08 à US-12) : entrée, sortie, retour, perte, dommage.

        Sprint 6 (RM-22) : une sortie est d'abord évaluée contre les règles
        métier du business (RM-05, RM-07). Règle BLOCAGE = refus obligatoire ;
        règle AVERTISSEMENT = la demande renvoie les alertes et exige, pour
        poursuivre, `ignorer_avertissements=true` + `motif_exception` (US-19,
        US-20, US-21) ainsi que la permission stock.exception (RM-19).
      parameters:
      - in: path
        name: business_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - businesses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockMovementRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StockMovementRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StockMovementRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovement'
          description: ''
  /api/invitations/{token}/:
    get:
      operationId: invitations_retrieve
      description: 'Aperçu public d''une invitation : email, business, rôle, inviteur.'
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - invitations
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
          description: ''
  /api/invitations/accept/:
    post:
      operationId: invitations_accept_create
      description: |-
        Acceptation par lien signé : mot de passe + activation + JWT (Sprint 10).

        L'invité n'est pas encore connecté : le token signé fait foi. La réponse
        est identique à /auth/register/ ({user, access, refresh}) pour connecter
        l'utilisateur immédiatement côté app.
      tags:
      - invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAccept'
          description: ''
  /api/permissions/:
    get:
      operationId: permissions_retrieve
      tags:
      - permissions
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
