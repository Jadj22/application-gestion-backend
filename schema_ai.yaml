openapi: 3.0.3
info:
  title: API Gestion d'équipement multi-tenant
  version: 1.0.0
  description: 'Backend Django multi-tenant : auth JWT, catalogue, stock & traçabilité,
    entretien, fiabilité, alertes métier, activités, notifications et réservations.
    Toutes les listes GET renvoient l''enveloppe paginée {count, next, previous, results}.'
paths:
  /api/ai/image-description/:
    post:
      operationId: ai_image_description_create
      description: |-
        Analyse d'une photo d'article par Gemini (Sprint 10).

        Renvoie {"nom": ..., "description": ...} pour pré-remplir le formulaire
        de création d'article quand l'utilisateur ne connaît pas l'article.
        La clé Gemini reste côté serveur (settings.GEMINI_API_KEY).
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageDescriptionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImageDescriptionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageDescriptionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageDescription'
          description: ''
  /api/auth/google/:
    post:
      operationId: auth_google_create
      description: |-
        Connexion par ID token Google (S 1-02, OAuth 2.0 mobile).

        L'app Android envoie l'ID token obtenu via google_sign_in ; le token est
        vérifié (signature, émetteur, audience) puis un utilisateur local est
        trouvé ou créé (google_sub) et lié à l'email Google si le compte existe
        déjà. Réponse identique à /auth/login/ : {user, access, refresh}.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuth'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Scope de throttling commun aux endpoints d'authentification (S9).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
