    InvitationAccept:
      type: object
      description: |-
        Acceptation d'une invitation (POST /invitations/accept/).

        Deux modes :
        * non connecté : `code` (ou `token`) + mot de passe requis (compte créé à
          l'invitation sans mot de passe) → JWT renvoyés (connexion immédiate) ;
        * connecté : `code` seul, l'utilisateur courant doit correspondre à
          l'email invité → le membership est activé sans nouveau mot de passe.
      properties:
        token:
          type: string
        code:
          type: string
          maxLength: 24
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        telephone:
          type: string
    InvitationAcceptRequest:
      type: object
      description: |-
        Acceptation d'une invitation (POST /invitations/accept/).

        Deux modes :
        * non connecté : `code` (ou `token`) + mot de passe requis (compte créé à
          l'invitation sans mot de passe) → JWT renvoyés (connexion immédiate) ;
        * connecté : `code` seul, l'utilisateur courant doit correspondre à
          l'email invité → le membership est activé sans nouveau mot de passe.
      properties:
        token:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
          maxLength: 24
        password:
          type: string
          writeOnly: true
          minLength: 8
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        telephone:
          type: string
    InvitationCode:
      type: object
      description: |-
        Validation d'un code d'invitation (POST /invitations/validate/).

        La normalisation et la recherche se font côté vue ; un code inconnu ou
        malformé est traité comme « Code invalide » (404), pas comme une erreur
        de champ.
      properties:
        code:
          type: string
          maxLength: 24
      required:
      - code
    InvitationCodeRequest:
      type: object
      description: |-
        Validation d'un code d'invitation (POST /invitations/validate/).

        La normalisation et la recherche se font côté vue ; un code inconnu ou
        malformé est traité comme « Code invalide » (404), pas comme une erreur
        de champ.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 24
      required:
      - code
