openapi: 3.0.3
info:
  title: API Gestion d'équipement multi-tenant
  version: 1.0.0
  description: 'Backend Django multi-tenant : auth JWT, catalogue, stock & traçabilité,
    entretien, fiabilité, alertes métier, activités, notifications et réservations.
    Toutes les listes GET renvoient l''enveloppe paginée {count, next, previous, results}.'
paths:
  /api/ai/image-description/:
    post:
      operationId: ai_image_description_create
      description: |-
        Analyse d'une photo d'article par Gemini (Sprint 10).

        Renvoie {"nom": ..., "description": ...} pour pré-remplir le formulaire
        de création d'article quand l'utilisateur ne connaît pas l'article.
        La clé Gemini reste côté serveur (settings.GEMINI_API_KEY).
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageDescriptionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImageDescriptionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageDescriptionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageDescription'
          description: ''
  /api/ai/item-description/:
    post:
      operationId: ai_item_description_create
      description: |-
        `POST /ai/item-description/` — génère une fiche article sans photo.

        Pendant textuel de l'analyse d'image : même forme de réponse, donc
        l'application traite les propositions de la même façon quelle que soit la
        source choisie par l'utilisateur.
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemDescriptionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ItemDescriptionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ItemDescriptionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDescription'
          description: ''
  /api/auth/google/:
    post:
      operationId: auth_google_create
      description: |-
        Connexion par ID token Google (S 1-02, OAuth 2.0 mobile).

        L'app Android envoie l'ID token obtenu via google_sign_in ; le token est
        vérifié (signature, émetteur, audience) puis un utilisateur local est
        trouvé ou créé (google_sub) et lié à l'email Google si le compte existe
        déjà. Réponse identique à /auth/login/ : {user, access, refresh}.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuth'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Scope de throttling commun aux endpoints d'authentification (S9).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    delete:
      operationId: auth_me_destroy
      description: Suppression définitive du compte authentifié (RGPD / profil).
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Scope de throttling commun aux endpoints d'authentification (S9).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Scope de throttling commun aux endpoints d'authentification (S9).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
  /api/business-types/:
    get:
