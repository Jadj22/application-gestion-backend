        Crée un mouvement (US-08 à US-12) : entrée, sortie, retour, perte, dommage.

        Sprint 6 (RM-22) : une sortie est d'abord évaluée contre les règles
        métier du business (RM-05, RM-07). Règle BLOCAGE = refus obligatoire ;
        règle AVERTISSEMENT = la demande renvoie les alertes et exige, pour
        poursuivre, `ignorer_avertissements=true` + `motif_exception` (US-19,
        US-20, US-21) ainsi que la permission stock.exception (RM-19).
      parameters:
      - in: path
        name: business_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - businesses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockMovementRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StockMovementRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StockMovementRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovement'
          description: ''
  /api/businesses/current/context/:
    get:
      operationId: businesses_current_context_retrieve
      description: |-
        Retourne le contexte RBAC complet pour le business courant (X-Business-ID).

        GET /api/businesses/current/context/

        Nécessite :
          - JWT valide (Authorization: Bearer <access>)
          - Header X-Business-ID avec l'UUID d'un business dont l'utilisateur est
            membre ACTIF.

        Réponse :
          {
            "business": { "id", "nom", "business_type", "slug" },
            "membership": { "id", "statut" },
            "role": { "id", "nom", "is_system" } | null,
            "permissions": ["codename1", ...]
