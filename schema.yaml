components:
  schemas:
    ActionEnum:
      enum:
      - accepter
      - refuser
      - contre_proposer
      type: string
      description: |-
        * `accepter` - accepter
        * `refuser` - refuser
        * `contre_proposer` - contre_proposer
    ActiveInactiveStatutEnum:
      enum:
      - ACTIF
      - INACTIF
      type: string
      description: |-
        * `ACTIF` - Actif
        * `INACTIF` - Inactif
    ActivityLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        action:
          type: string
          readOnly: true
        acteur:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        item_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        cible:
          type: string
          readOnly: true
        detail:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - acteur
      - action
      - cible
      - created_at
      - detail
      - id
      - item_id
    Alert:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        item_id:
          type: string
          format: uuid
          readOnly: true
        item_nom:
          type: string
          readOnly: true
        code:
          type: string
          readOnly: true
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          readOnly: true
        message:
          type: string
          readOnly: true
        quantite:
          type: integer
          readOnly: true
          nullable: true
        mouvement_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        acteur:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - acteur
      - code
      - created_at
      - id
      - item_id
      - item_nom
      - message
      - mode
      - mouvement_id
      - quantite
    BookingRequestAction:
      type: object
      description: 'Actions équipe : accepter, refuser, contre-proposer.'
      properties:
        action:
          $ref: '#/components/schemas/ActionEnum'
        motif_refus:
          type: string
        date_debut:
          type: string
          format: date
        date_fin:
          type: string
          format: date
        quantite:
          type: integer
          minimum: 1
        prix:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        message:
          type: string
      required:
      - action
    BookingRequestActionRequest:
      type: object
      description: 'Actions équipe : accepter, refuser, contre-proposer.'
      properties:
        action:
          $ref: '#/components/schemas/ActionEnum'
        motif_refus:
          type: string
        date_debut:
          type: string
          format: date
        date_fin:
          type: string
          format: date
        quantite:
          type: integer
          minimum: 1
        prix:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        message:
          type: string
      required:
      - action
    BookingRequestStatutEnum:
      enum:
      - DRAFT
      - EN_ATTENTE
      - ACCEPTEE
      - REFUSEE
      - EXPIREE
      - ANNULEE_CLIENT
      - CONVERTIE
      type: string
      description: |-
        * `DRAFT` - Brouillon
        * `EN_ATTENTE` - En attente de traitement
        * `ACCEPTEE` - Acceptée par l'équipe
        * `REFUSEE` - Refusée
        * `EXPIREE` - Expirée (pas de réponse)
        * `ANNULEE_CLIENT` - Annulée par le client
        * `CONVERTIE` - Transformée en réservation
    BookingRequestTeam:
      type: object
      description: Détail d'une demande pour l'équipe (avec infos complètes).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        item_id:
          type: string
          format: uuid
          readOnly: true
        item_nom:
          type: string
          readOnly: true
        item_reference:
          type: string
          readOnly: true
        client_nom:
          type: string
          readOnly: true
        client_telephone:
          type: string
          readOnly: true
        client_email:
          type: string
          format: email
          readOnly: true
        date_debut:
          type: string
          format: date
          readOnly: true
        date_fin:
          type: string
          format: date
          readOnly: true
        quantite:
          type: integer
          readOnly: true
        message:
          type: string
          readOnly: true
          description: Message du client (besoin, occasion, etc.)
        lieu_nom:
          type: string
          readOnly: true
        lieu_adresse:
          type: string
          readOnly: true
        contact_nom:
          type: string
          readOnly: true
        contact_telephone:
          type: string
          readOnly: true
        notes_livraison:
          type: string
          readOnly: true
        statut:
          allOf:
          - $ref: '#/components/schemas/BookingRequestStatutEnum'
          readOnly: true
        statut_display:
          type: string
          readOnly: true
        traite_par:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        traite_le:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        motif_refus:
          type: string
          readOnly: true
        contre_proposition:
          readOnly: true
          nullable: true
          description: 'Contre-proposition : {date_debut, date_fin, quantite, prix,
            message}'
        reservation_creee_id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - client_email
      - client_nom
      - client_telephone
      - contact_nom
      - contact_telephone
      - contre_proposition
      - created_at
      - date_debut
      - date_fin
      - id
      - item_id
      - item_nom
      - item_reference
      - lieu_adresse
      - lieu_nom
      - message
      - motif_refus
      - notes_livraison
      - quantite
      - reservation_creee_id
      - statut
      - statut_display
      - traite_le
      - traite_par
      - updated_at
